# mallard configuration. Every key is optional; shown values are defaults.
# Run with `mallard serve -c <file>` (or MALLARD_CONFIG); `mallard check -c <file>`
# validates it.
# Environment variables override the file: MALLARD_<SECTION>__<KEY>, e.g.
#   MALLARD_STORAGE__DATA_PATH=s3://my-bucket/lake/
#   MALLARD_OTEL__RETENTION__TRACES=0          (string settings keep the text as is)
#   MALLARD_SENTRY__RETENTION__EVENTS=30d
#   MALLARD_SERVER__API_TOKENS=a,b             (lists: comma separated)
# "${NAME}" inside a string value is replaced by environment variable NAME.
# Unknown keys are errors.

[server]
http_addr = "0.0.0.0:8080"        # Sentry ingest (/sentry), APIs (/sentry/v1, /otel/api/v1, /api/v1), OTLP/HTTP (/v1/*), /metrics
otlp_http_addr = "0.0.0.0:4318"   # OTLP/HTTP on the standard port
otlp_grpc_addr = "0.0.0.0:4317"   # OTLP/gRPC
metrics_addr = ""                 # e.g. "0.0.0.0:9090": serve /metrics there instead of on http_addr
public_url = "http://localhost:8080"   # how SDKs reach http_addr; Sentry DSNs use <public_url>/sentry
api_tokens = ["${MALLARD_API_TOKEN}"]   # required: bearer tokens for both query APIs (comma separated in the env var)
ingest_tokens = []                # bearer tokens for OTLP ingest; empty = open
log_format = "text"               # text | json

# One DuckLake catalog for both errors (schema "sentry") and telemetry (schema "otel").
[storage]
# "data/catalog.ducklake" (DuckDB file), "sqlite:data/catalog.sqlite",
# or "postgres:host=pg dbname=ducklake user=mallard password=${PGPASSWORD}" (multi-replica)
catalog = "data/catalog.ducklake"
data_path = "data/lake/"          # local path, s3://, gs://, az://, r2:// ...
# Sentry sourcemap bundles (empty = sourcemap upload answers 501). A local
# path, s3://, gs:// or az://, outside data_path (not r2:// or abfss://; for R2
# use s3:// with its endpoint). Credentials come from the [[storage.secrets]]
# entry of that type whose scope covers it (azure: its connection_string).
artifacts_path = ""               # e.g. "data/artifacts" or "s3://my-bucket/artifacts"
data_inlining_row_limit = 1000
target_file_size = "128MB"
row_group_size = 122880
extensions = []
# [[storage.secrets]]             # object storage credentials (DuckDB secrets)
# type = "s3"
# key_id = "${S3_ACCESS_KEY_ID}"
# secret = "${S3_SECRET_ACCESS_KEY}"
# endpoint = "minio:9000"
# url_style = "path"
# use_ssl = false

[duckdb]
memory_limit = ""                 # e.g. "1GB". Always set it in a container; about half its memory.
                                  # Container >= memory_limit + otel.ingest.max_buffer_bytes + 0.9 GiB
                                  # (docs/otel/capacity.md; 2 GiB: "1GB", a "128MB" buffer and 4 threads)
threads = 0                       # 0 = all cores, or the container's CPU limit. More threads use more memory.
temp_directory = ""
extension_directory = ""
autoinstall_extensions = true

# OpenTelemetry side (docs/otel/configuration.md has every key).
[otel.ingest]
flush_interval = "5s"
flush_rows = 200000
max_buffer_bytes = "512MB"
max_request_bytes = "32MB"

[otel.retention]                  # "0" keeps data forever
traces = "7d"
logs = "7d"
metrics = "30d"

[otel.maintenance]
enabled = true
compact_interval = "10m"

[otel.query]
max_concurrent = 4
timeout = "30s"
max_window = "31d"
enable_sql = false

# Sentry side.
[sentry.retention]                # "0" keeps events forever (rounded up to days)
events = "90d"

[sentry.ingest]
max_event_bytes = "1MiB"
max_body_bytes = "20MiB"
concurrency = 256                 # ingest requests processed at once
queue_capacity = 20000            # events waiting to be written; then 429
batch_max = 2000
batch_window = "500ms"
trust_forwarded_for = false       # client IP from X-Forwarded-For (one proxy hop only)

[sentry.maintenance]
flush_interval = "5m"
flush_rows = 10000
compact_interval = "2m"

[sentry.query]
readers = 4
max_window = "366d"
enable_sql = false                # POST /sentry/v1/sql over events, issues, issue_activity (= admin access; ADR 0011)
sql_timeout = "30s"

[sentry.sourcemaps]
cache_size = "256MiB"

# Between the two sides (docs/adr/0009-bridge.md).
[bridge]
transactions = true               # store Sentry transactions and streamed spans as OTel traces
exceptions = true                 # OTel exceptions (span events, logs) become Sentry events and issues
default_project = ""              # project slug for exceptions whose service.name matches no project;
                                  # "" = create a project per service (created when missing either way;
                                  # a project with the same slug under the slug rule is used instead)
dedupe_window = "10s"             # how long a bridged item waits for its copy from the other side
                                  # (max "10m"): an OTel exception for a Sentry SDK event of the same
                                  # trace + span, a Sentry transaction or span item for OTLP spans
                                  # with its span ids (ADR 0010). Copies that came are dropped.
