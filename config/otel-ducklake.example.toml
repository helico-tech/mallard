# otel-ducklake configuration. Every key is optional; shown values are defaults.
# Environment variables override the file: ODL_<SECTION>__<KEY>, e.g.
#   ODL_STORAGE__DATA_PATH=s3://my-bucket/otel/
# "${NAME}" inside a value is replaced by environment variable NAME.

[server]
otlp_grpc_addr = "0.0.0.0:4317"   # OTLP/gRPC receiver
otlp_http_addr = "0.0.0.0:4318"   # OTLP/HTTP receiver (protobuf + JSON)
api_addr = "0.0.0.0:8080"         # Query API, OpenAPI at /openapi.json, docs at /docs
log_format = "text"               # text | json

[storage]
# DuckLake catalog (metadata). One of:
#   "data/catalog.ducklake"                               DuckDB file  (single process)
#   "sqlite:data/catalog.sqlite"                          SQLite file  (single process)
#   "postgres:host=pg dbname=ducklake user=odl password=${PGPASSWORD}"   (multi-replica)
catalog = "data/catalog.ducklake"
# Where Parquet data files go: local path, s3://, gs://, az://, abfss://, r2://, hf:// ...
data_path = "data/lake/"
schema = "otel"
# Inserts smaller than this many rows are stored inside the catalog until the
# next compaction, avoiding tiny Parquet files during quiet periods. 0 = off.
data_inlining_row_limit = 1000
target_file_size = "128MB"
row_group_size = 122880
extensions = []                    # e.g. ["azure"]

# Credentials for object storage become DuckDB secrets. Examples:
# [[storage.secrets]]
# type = "s3"
# provider = "credential_chain"    # IAM role / env / ~/.aws
#
# [[storage.secrets]]
# type = "s3"                      # MinIO / any S3-compatible store
# key_id = "${S3_ACCESS_KEY_ID}"
# secret = "${S3_SECRET_ACCESS_KEY}"
# endpoint = "minio:9000"
# url_style = "path"
# use_ssl = false
#
# [[storage.secrets]]
# type = "gcs"
# key_id = "${GCS_HMAC_KEY}"
# secret = "${GCS_HMAC_SECRET}"
#
# [[storage.secrets]]
# type = "azure"
# connection_string = "${AZURE_STORAGE_CONNECTION_STRING}"

[ingest]
flush_interval = "5s"              # max time data sits in memory before it is written
flush_rows = 200000                # flush early when this many rows are buffered
max_buffer_bytes = "512MB"         # above this, receivers answer 429 / RESOURCE_EXHAUSTED
max_request_bytes = "32MB"         # per OTLP request, after decompression

[retention]                        # "0" keeps data forever
traces = "7d"
logs = "7d"
metrics = "30d"

[maintenance]
enabled = true
compact_interval = "10m"           # flush inlined rows + merge files < small_file_size
small_file_size = "16MB"
full_compact_interval = "6h"       # merge files up to storage.target_file_size
retention_interval = "1h"          # retention deletes, snapshot expiry, file cleanup
snapshot_retention = "1h"          # time travel window
file_cleanup_delay = "15m"         # grace period before unreferenced files are deleted
catalog_wide = true                # snapshot expiry + file cleanup (catalog-wide; one owner per catalog)

[query]
max_concurrent = 4
timeout = "30s"
max_window = "31d"
enable_sql = false                 # POST /api/v1/sql; requires auth.api_tokens

[auth]
api_tokens = []                    # e.g. ["${ODL_API_TOKEN}"]; empty = open
ingest_tokens = []                 # bearer tokens for OTLP; empty = open

[duckdb]
memory_limit = ""                  # e.g. "2GB"; empty = DuckDB default (80% of RAM)
threads = 0                        # 0 = all cores
temp_directory = ""                # spill location for big queries
extension_directory = ""           # where extensions are installed
autoinstall_extensions = true      # false for air-gapped images with bundled extensions
