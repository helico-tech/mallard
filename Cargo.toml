[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/helico-tech/mallard"
rust-version = "1.90"

[workspace.dependencies]
# In-tree crates: sdl-* = Sentry side, odl-* = OpenTelemetry side,
# mallard-* = the app that bundles both.
sdl-types = { path = "crates/sdl-types" }
sdl-protocol = { path = "crates/sdl-protocol" }
sdl-client = { path = "crates/sdl-client" }
sdl-server = { path = "crates/sdl-server" }
sdl-cli = { path = "crates/sdl-cli" }
odl-api = { path = "crates/odl-api" }
odl-client = { path = "crates/odl-client" }
odl-server = { path = "crates/odl-server" }
odl-cli = { path = "crates/odl-cli" }
mallard-server = { path = "crates/mallard-server" }
mallard-client = { path = "crates/mallard-client" }
# DuckDB is bundled and linked once; all crates must use this exact version.
duckdb = { version = "=1.20000.1", features = ["bundled", "appender-arrow", "chrono", "json", "parquet"] }
anyhow = "1"
arrow = { version = "60", default-features = false }
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
flate2 = "1"
futures = "0.3"
humantime = "2"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "trace", "logs", "metrics", "with-serde"] }
prost = "0.14"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tonic = { version = "0.14", features = ["gzip", "zstd"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "decompression-gzip", "compression-gzip", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "6", features = ["chrono", "uuid", "axum_extras"] }
utoipa-axum = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# DuckDB's C++ is always built optimized: downloaded extensions are release
# builds and trip debug-only allocator assertions otherwise.
[profile.dev.package.libduckdb-sys]
opt-level = 3
debug = false
debug-assertions = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
