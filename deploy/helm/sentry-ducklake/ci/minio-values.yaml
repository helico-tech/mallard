# Self-hosted S3 with path style, Postgres connection string in values.
publicUrl: http://sentry.local
apiToken: test-token
storage:
  url: s3://sentry/errors
  s3:
    endpoint: http://minio.storage:9000
    pathStyle: true
  credentials:
    existingSecret: s3-keys
catalog:
  type: postgres
  postgres:
    connectionString: "host=pg port=5432 dbname=ducklake user=sdl password=pw"
