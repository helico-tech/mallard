# GCS with HMAC keys and a DuckDB catalog on an existing claim.
publicUrl: https://errors.example.com/sentry
apiToken: a,b
storage:
  url: gs://bucket/prefix
  credentials:
    existingSecret: gcs-hmac
catalog:
  duckdb:
    persistence:
      existingClaim: my-claim
duckdb:
  memoryLimit: ""
  threads: "2"
