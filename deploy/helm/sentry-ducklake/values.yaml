# Default values for sentry-ducklake.
# Required: publicUrl, an API token (apiToken or existingSecret) and a storage
# URL that points at a bucket you own.

image:
  repository: ghcr.io/helico-tech/sentry-ducklake
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Number of pods. Only used with catalog.type=postgres; the DuckDB-file
# catalog always runs exactly one pod. Read "Running more than one pod" in
# docs/deployment.md before raising this.
replicaCount: 1

# Public base URL of the server, used to build DSNs (what SDKs connect to).
# Usually the ingress URL, e.g. https://sentry.example.com
publicUrl: ""

# Bearer token(s) for the management API and sourcemap uploads (comma
# separated). Ignored when existingSecret is set.
apiToken: ""
# Name of an existing Secret holding the token under existingSecretKey.
existingSecret: ""
existingSecretKey: api-token

storage:
  # Where Parquet files and sourcemap bundles live:
  #   s3://bucket/prefix  (AWS S3, Cloudflare R2, MinIO, Garage, RustFS, ...)
  #   gs://bucket/prefix  (GCS through HMAC keys)
  #   az://container/prefix
  #   /data/storage       (local path; only with catalog.type=duckdb, on its volume)
  url: s3://my-bucket/sentry
  s3:
    # Custom endpoint including scheme, e.g. http://minio.storage:9000 or
    # https://<account>.r2.cloudflarestorage.com. Empty = AWS.
    endpoint: ""
    region: us-east-1
    # Path-style URLs; needed by most self-hosted S3 servers.
    pathStyle: false
  credentials:
    # Existing Secret whose keys are exported as environment variables, e.g.
    # AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY, GCS_HMAC_KEY_ID +
    # GCS_HMAC_SECRET, or AZURE_STORAGE_CONNECTION_STRING.
    existingSecret: ""
    # Or let the chart create that Secret from these values (same keys).
    env: {}
    #   AWS_ACCESS_KEY_ID: ...
    #   AWS_SECRET_ACCESS_KEY: ...
    # With neither set, S3 and Azure use the pod's cloud identity (IRSA, EKS
    # Pod Identity, Azure workload identity) through serviceAccount.annotations.

catalog:
  # duckdb: catalog in a DuckDB file on a PersistentVolume (ReadWriteOnce).
  #         One pod only; the chart forces replicas=1 and strategy Recreate.
  # postgres: catalog in PostgreSQL; pods keep no state.
  type: duckdb
  duckdb:
    persistence:
      # Use an existing PVC instead of creating one.
      existingClaim: ""
      storageClass: ""
      size: 10Gi
      annotations: {}
  postgres:
    # Libpq connection string, stored in a chart-managed Secret:
    #   host=pg.example.com port=5432 dbname=ducklake user=sdl password=... sslmode=require
    # Ignored when existingSecret is set.
    connectionString: ""
    # Existing Secret with the libpq connection string (without "postgres:")
    # under existingSecretKey.
    existingSecret: ""
    existingSecretKey: catalog

# Delete events older than this many days (0 = keep forever).
retentionDays: 90

duckdb:
  # DuckDB memory limit. Keep it well below resources.limits.memory: the
  # server also needs memory for HTTP buffers and the sourcemap cache.
  memoryLimit: 1GB
  # Worker threads; empty = number of CPUs DuckDB sees.
  threads: ""

# Log as JSON lines.
logJson: true
# RUST_LOG filter.
logLevel: info

# Extra environment variables (any SDL_* setting, see docs/deployment.md).
extraEnv: []
#  - name: SDL_FLUSH_INTERVAL
#    value: 5m
extraEnvFrom: []

serviceAccount:
  create: true
  name: ""
  # IRSA: eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/sentry-ducklake
  # Azure: azure.workload.identity/client-id: <client id>
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Sized for a small/mid company (up to a few hundred events per second).
# See docs/deployment.md for sizing guidance.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 2Gi

# Time to commit queued events and flush inlined data to Parquet on stop.
terminationGracePeriodSeconds: 90

# Size limit of the scratch volume (DuckDB spill files) when /data is not a PVC.
scratchSizeLimit: 2Gi

startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  failureThreshold: 60
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 4
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  # Browser SDKs send cross-origin requests; the server answers CORS itself,
  # so do not add CORS annotations here (duplicate headers break browsers).
  # Raise the body size limit for sourcemap uploads (up to 33 MiB), e.g.
  #   nginx.ingress.kubernetes.io/proxy-body-size: 64m
  # /metrics and /docs are served on the same port: block /metrics at the
  # ingress if it must not be public.
  annotations: {}
  hosts:
    - host: sentry.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: sentry-tls
  #    hosts: [sentry.example.com]

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
