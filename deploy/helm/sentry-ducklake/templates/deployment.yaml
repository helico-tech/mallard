{{- include "sdl.validate" . -}}
{{- $duckdb := eq .Values.catalog.type "duckdb" -}}
{{- $storageSecret := include "sdl.storageSecret" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sdl.fullname" . }}
  labels:
    {{- include "sdl.labels" . | nindent 4 }}
spec:
  replicas: {{ include "sdl.replicas" . }}
  revisionHistoryLimit: 5
  {{- if $duckdb }}
  # One process owns the DuckDB catalog file: never run two pods at once.
  strategy:
    type: Recreate
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  selector:
    matchLabels:
      {{- include "sdl.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "sdl.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "sdl.serviceAccountName" . }}
      # The server does not call the Kubernetes API. IRSA / workload identity
      # webhooks project their own tokens.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: SDL_LISTEN
              value: "0.0.0.0:8000"
            - name: SDL_PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
            - name: SDL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "sdl.tokenSecret" . }}
                  key: {{ if .Values.existingSecret }}{{ .Values.existingSecretKey }}{{ else }}api-token{{ end }}
            {{- if $duckdb }}
            - name: SDL_CATALOG
              value: /data/catalog.ducklake
            {{- else }}
            - name: SDL_CATALOG_PG
              valueFrom:
                secretKeyRef:
                  name: {{ include "sdl.catalogSecret" . }}
                  key: {{ if .Values.catalog.postgres.existingSecret }}{{ .Values.catalog.postgres.existingSecretKey }}{{ else }}catalog{{ end }}
            - name: SDL_CATALOG
              value: "postgres:$(SDL_CATALOG_PG)"
            {{- end }}
            - name: SDL_STORAGE_URL
              value: {{ .Values.storage.url | quote }}
            {{- with .Values.storage.s3.endpoint }}
            - name: SDL_S3_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: SDL_S3_REGION
              value: {{ .Values.storage.s3.region | quote }}
            - name: SDL_S3_PATH_STYLE
              value: {{ .Values.storage.s3.pathStyle | quote }}
            - name: SDL_RETENTION_DAYS
              value: {{ .Values.retentionDays | quote }}
            {{- with .Values.duckdb.memoryLimit }}
            - name: SDL_DUCKDB_MEMORY_LIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.duckdb.threads }}
            - name: SDL_DUCKDB_THREADS
              value: {{ . | quote }}
            {{- end }}
            - name: SDL_LOG_JSON
              value: {{ .Values.logJson | quote }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or $storageSecret .Values.extraEnvFrom }}
          envFrom:
            {{- if $storageSecret }}
            - secretRef:
                name: {{ $storageSecret }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Working directory: DuckDB catalog file (duckdb mode) and spill files.
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if $duckdb }}
          persistentVolumeClaim:
            claimName: {{ include "sdl.pvcName" . }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.scratchSizeLimit }}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
