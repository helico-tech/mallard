{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mallard.fullname" . }}
  labels:
    {{- include "mallard.labels" . | nindent 4 }}
type: Opaque
data:
  api-token: {{ .Values.apiToken | b64enc | quote }}
  ingest-token: {{ .Values.ingestToken | default "" | b64enc | quote }}
{{- end }}
{{- if and (not .Values.storage.credentials.existingSecret) .Values.storage.credentials.env }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mallard.fullname" . }}-storage
  labels:
    {{- include "mallard.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $v := .Values.storage.credentials.env }}
  {{ $k }}: {{ $v | toString | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and (eq .Values.catalog.type "postgres") (not .Values.catalog.postgres.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mallard.fullname" . }}-catalog
  labels:
    {{- include "mallard.labels" . | nindent 4 }}
type: Opaque
data:
  catalog: {{ .Values.catalog.postgres.connectionString | trimPrefix "postgres:" | b64enc | quote }}
{{- end }}
