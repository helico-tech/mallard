# AWS: S3 through IRSA (no static keys), Postgres catalog from an existing Secret.
publicUrl: https://obs.example.com
existingSecret: obs-tokens
existingSecretIngestKey: ingest-token
storage:
  dataPath: s3://my-bucket/obs/lake/
  artifactsUrl: s3://my-bucket/obs/artifacts
catalog:
  type: postgres
  postgres:
    existingSecret: obs-catalog
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/obs-ducklake
ingress:
  enabled: true
  className: nginx
serviceMonitor:
  enabled: true
podDisruptionBudget:
  enabled: true
