# Self-hosted S3 with path style, Postgres catalog, static keys.
publicUrl: http://obs.local
apiToken: test-token
ingestToken: ingest-token
storage:
  dataPath: s3://obs/lake/
  artifactsUrl: s3://obs/artifacts
  s3:
    endpoint: http://minio.storage:9000
    pathStyle: true
  credentials:
    existingSecret: s3-keys
catalog:
  type: postgres
  postgres:
    connectionString: "host=pg port=5432 dbname=ducklake user=obs password=pw"
replicaCount: 2
