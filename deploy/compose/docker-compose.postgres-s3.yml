# Shared storage: PostgreSQL catalog + S3-compatible object storage, with two
# collector replicas writing to the same lake.
#
#   docker compose -f deploy/compose/docker-compose.postgres-s3.yml up -d --build
#   docker compose -f deploy/compose/docker-compose.postgres-s3.yml --profile loadgen up -d
#   docker compose -f deploy/compose/docker-compose.postgres-s3.yml exec odl-1 odl status
#
# Replica odl-1: OTLP on 4317/4318, API on 8080. Replica odl-2: 14317/14318/18080.
# All ports are published on 127.0.0.1 only: this is a demo with no auth and
# demo credentials. To expose it on the network, enable auth first
# (ODL_AUTH__API_TOKENS / ODL_AUTH__INGEST_TOKENS) and then drop the
# "127.0.0.1:" prefixes.
#
# Object storage is SeaweedFS (Apache-2.0) speaking S3 on port 8333; any
# S3-compatible store works the same way (AWS S3, R2, MinIO, Ceph, Garage):
# only the [[storage.secrets]] block in config/shared.toml changes.
# (MinIO no longer publishes free container images, so it is not used here.)
#
# Only odl-1 runs catalog-wide maintenance (snapshot expiry, file cleanup);
# both run compaction and retention for the tables (safe, just redundant).
# Credentials below are demo values: change them for anything real.

name: otel-ducklake-shared

x-odl: &odl
  image: ${ODL_IMAGE:-otel-ducklake:dev}
  volumes:
    - ./config/shared.toml:/etc/otel-ducklake/config.toml:ro
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "odl", "--url", "http://localhost:8080", "health"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 15s

x-odl-env: &odl-env
  RUST_LOG: info
  PGPASSWORD: ${PGPASSWORD:-odl-secret}
  S3_ACCESS_KEY_ID: otel-access-key
  S3_SECRET_ACCESS_KEY: otel-secret-key-change-me
  ODL_MAINTENANCE__COMPACT_INTERVAL: ${ODL_COMPACT_INTERVAL:-10m}

x-loadgen: &loadgen
  image: ${ODL_IMAGE:-otel-ducklake:dev}
  profiles: ["loadgen"]
  entrypoint: ["/usr/local/bin/odl-loadgen"]
  restart: unless-stopped

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ducklake
      POSTGRES_USER: odl
      POSTGRES_PASSWORD: ${PGPASSWORD:-odl-secret}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odl -d ducklake"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.51
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - s3-data:/data
      - ./config/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:8333:8333"

  # Creates the bucket (retries until the S3 endpoint answers).
  s3-init:
    image: amazon/aws-cli:2.39.3
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: otel-access-key
      AWS_SECRET_ACCESS_KEY: otel-secret-key-change-me
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        for i in $$(seq 1 60); do
          aws --endpoint-url http://s3:8333 s3api head-bucket --bucket otel 2>/dev/null && exit 0;
          aws --endpoint-url http://s3:8333 s3 mb s3://otel && exit 0;
          sleep 1;
        done; exit 1

  odl-1:
    <<: *odl
    # Only this service builds the image; odl-2 and the load generators reuse it.
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      <<: *odl-env
      ODL_MAINTENANCE__CATALOG_WIDE: "true"
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8080:8080"

  odl-2:
    <<: *odl
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      # Start after odl-1 so the image exists and the schema is created once.
      odl-1:
        condition: service_healthy
    environment:
      <<: *odl-env
      ODL_MAINTENANCE__CATALOG_WIDE: "false"
    ports:
      - "127.0.0.1:14317:4317"
      - "127.0.0.1:14318:4318"
      - "127.0.0.1:18080:8080"

  # Demo traffic to both replicas: docker compose --profile loadgen up -d
  loadgen-1:
    <<: *loadgen
    command: ["--endpoint", "http://odl-1:4318", "--rate", "${LOADGEN_RATE:-20}", "--duration", "0"]
    depends_on:
      odl-1:
        condition: service_healthy
  loadgen-2:
    <<: *loadgen
    command: ["--endpoint", "http://odl-2:4318", "--rate", "${LOADGEN_RATE:-20}", "--duration", "0"]
    depends_on:
      odl-2:
        condition: service_healthy

volumes:
  pg-data:
  s3-data:
