# Full local stack: mallard + S3-compatible object store (RustFS) +
# PostgreSQL as the DuckLake catalog.
#
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
#
#   export MALLARD_URL=http://localhost:8080 MALLARD_TOKEN=dev-token
#   mallard status
#   curl -XPOST -H "Authorization: Bearer $MALLARD_TOKEN" -H 'content-type: application/json' \
#        $MALLARD_URL/sentry/v1/projects -d '{"name":"web"}'          # returns a Sentry DSN
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318             # for OTel SDKs
#
# Simpler mode (DuckDB-file catalog on the mallard-data volume, data still on S3;
# one server process only):
#
#   MALLARD_CATALOG=/data/catalog.ducklake docker compose -f deploy/compose/docker-compose.yml up -d
#
# Settings you may want to override (shell env or a .env file next to this file):
#   MALLARD_PORT (8080), MALLARD_API_TOKEN (dev-token), MALLARD_CATALOG, S3_ACCESS_KEY,
#   S3_SECRET_KEY, POSTGRES_PASSWORD, MALLARD_IMAGE.
# The defaults are for local use only. Change every secret before exposing it.

name: mallard

x-s3-credentials: &s3-credentials
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mallard-access-key}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-mallard-secret-key-change-me}
  S3_BUCKET: mallard

services:
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-mallard-access-key}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-mallard-secret-key-change-me}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Creates the bucket once. Safe to re-run.
  create-bucket:
    image: rustfs/rustfs:1.0.4
    depends_on:
      rustfs:
        condition: service_healthy
    environment: *s3-credentials
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        url="http://rustfs:9000/$${S3_BUCKET}"
        sign="--aws-sigv4 aws:amz:us-east-1:s3 --user $${S3_ACCESS_KEY}:$${S3_SECRET_KEY}"
        if curl -fsS -o /dev/null -I $$sign "$$url"; then
          echo "bucket $${S3_BUCKET} exists"
        else
          curl -fsS -X PUT $$sign "$$url" && echo "bucket $${S3_BUCKET} created"
        fi
    restart: "no"

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ducklake
      POSTGRES_USER: mallard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mallard-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mallard -d ducklake"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mallard:
    image: ${MALLARD_IMAGE:-mallard:dev}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      create-bucket:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "${MALLARD_PORT:-8080}:8080"   # Sentry ingest + APIs + OTLP/HTTP
      - "${MALLARD_OTLP_HTTP_PORT:-4318}:4318"
      - "${MALLARD_OTLP_GRPC_PORT:-4317}:4317"
    environment:
      MALLARD_CONFIG: /etc/mallard/mallard.toml
      MALLARD_PUBLIC_URL: http://localhost:${MALLARD_PORT:-8080}
      MALLARD_API_TOKEN: ${MALLARD_API_TOKEN:-dev-token}
      MALLARD_CATALOG: ${MALLARD_CATALOG:-postgres:host=postgres port=5432 dbname=ducklake user=mallard password=${POSTGRES_PASSWORD:-mallard-change-me}}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-mallard-access-key}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-mallard-secret-key-change-me}
      # Measured for mem_limit 2g, both sides (docs/otel/capacity.md). Change them together.
      MALLARD_DUCKDB__MEMORY_LIMIT: 1GB
      MALLARD_DUCKDB__THREADS: 4
      MALLARD_OTEL__INGEST__MAX_BUFFER_BYTES: 128MB
      RUST_LOG: info
    volumes:
      - ./mallard.toml:/etc/mallard/mallard.toml:ro
      # DuckDB-file catalog in simple mode, and DuckDB's spill files.
      - mallard-data:/data
    mem_limit: 2g
    memswap_limit: 2g
    # Long enough for both libraries to flush on stop.
    stop_grace_period: 60s
    restart: unless-stopped

  # The Web UI on http://localhost:8088 (MALLARD_WEB_PORT): sign in with the API
  # token. Published on this machine only: anywhere else it needs TLS in front,
  # because the session cookie is Secure. It holds no token itself, since it
  # refuses to listen on 0.0.0.0 with one.
  web:
    image: ${MALLARD_IMAGE:-mallard:dev}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["web", "--addr", "0.0.0.0:8088"]
    depends_on:
      - mallard
    ports:
      - "127.0.0.1:${MALLARD_WEB_PORT:-8088}:8088"
    environment:
      MALLARD_URL: http://mallard:8080
    # The image's own check probes the server's port.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8088 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  rustfs-data:
  postgres-data:
  mallard-data:
