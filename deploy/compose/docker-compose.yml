# Single node: DuckDB-file catalog + Parquet files on a local volume.
#
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
#   docker compose -f deploy/compose/docker-compose.yml --profile loadgen up -d   # demo traffic
#   docker compose -f deploy/compose/docker-compose.yml exec otel-ducklake odl services
#
# Point your OpenTelemetry SDKs / Collector at localhost:4317 (gRPC) or
# http://localhost:4318 (HTTP). Query API: http://localhost:8080/docs
#
# Ports are published on 127.0.0.1 only, because auth is off by default and
# the query API can read all telemetry. To accept traffic from other hosts,
# set ODL_AUTH__API_TOKENS (and ODL_AUTH__INGEST_TOKENS) below first, then
# remove the "127.0.0.1:" prefixes.

name: otel-ducklake

services:
  otel-ducklake:
    image: ${ODL_IMAGE:-otel-ducklake:dev}
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4317:4317"   # OTLP/gRPC
      - "127.0.0.1:4318:4318"   # OTLP/HTTP
      - "127.0.0.1:8080:8080"   # query API + /docs
    volumes:
      - otel-data:/data
    environment:
      RUST_LOG: info
      ODL_RETENTION__TRACES: 7d
      ODL_RETENTION__LOGS: 7d
      ODL_RETENTION__METRICS: 30d
      ODL_DUCKDB__MEMORY_LIMIT: 1GB
      # ODL_AUTH__API_TOKENS: '["change-me"]'
      # ODL_AUTH__INGEST_TOKENS: '["change-me-too"]'
    healthcheck:
      test: ["CMD", "odl", "--url", "http://localhost:8080", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # Demo traffic: docker compose --profile loadgen up -d
  loadgen:
    image: ${ODL_IMAGE:-otel-ducklake:dev}
    profiles: ["loadgen"]
    entrypoint: ["/usr/local/bin/odl-loadgen"]
    command: ["--endpoint", "http://otel-ducklake:4318", "--rate", "${LOADGEN_RATE:-20}", "--duration", "0"]
    depends_on:
      otel-ducklake:
        condition: service_healthy
    restart: unless-stopped

volumes:
  otel-data:
