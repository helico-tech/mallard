# Used by CI (helm lint / template) to render shared mode.
mode: shared
replicaCount: 2
storage:
  catalog: "postgres:host=postgres port=5432 dbname=ducklake user=odl password=${PGPASSWORD}"
  dataPath: "s3://otel/lake/"
  secrets:
    - name: minio
      type: s3
      key_id: "${S3_ACCESS_KEY_ID}"
      secret: "${S3_SECRET_ACCESS_KEY}"
      endpoint: "minio:9000"
      region: us-east-1
      url_style: path
      use_ssl: false
auth:
  enabled: true
  apiToken: "ci-api-token"
query:
  enableSql: true
ingress:
  enabled: true
podDisruptionBudget:
  enabled: true
extraEnv:
  - name: PGPASSWORD
    value: odl-secret
  - name: S3_ACCESS_KEY_ID
    value: minioadmin
  - name: S3_SECRET_ACCESS_KEY
    value: minioadmin-secret
