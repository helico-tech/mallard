apiVersion: v1
kind: Service
metadata:
  name: {{ include "otel-ducklake.fullname" . }}
  labels:
    {{- include "otel-ducklake.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "otel-ducklake.selectorLabels" . | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.service.ports.otlpGrpc }}
      targetPort: otlp-grpc
      protocol: TCP
      appProtocol: grpc
    - name: otlp-http
      port: {{ .Values.service.ports.otlpHttp }}
      targetPort: otlp-http
      protocol: TCP
      appProtocol: http
    - name: api
      port: {{ .Values.service.ports.api }}
      targetPort: api
      protocol: TCP
      appProtocol: http
{{- if eq .Values.mode "single" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "otel-ducklake.fullname" . }}-headless
  labels:
    {{- include "otel-ducklake.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "otel-ducklake.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.service.ports.api }}
      targetPort: api
{{- end }}
