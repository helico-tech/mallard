{{- include "otel-ducklake.validate" . -}}
{{- $single := eq .Values.mode "single" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-ducklake.fullname" . }}
  labels:
    {{- include "otel-ducklake.labels" . | nindent 4 }}
data:
  config.toml: |
    # Generated by the otel-ducklake Helm chart. ${NAME} = pod environment variable.
    [server]
    otlp_grpc_addr = "0.0.0.0:4317"
    otlp_http_addr = "0.0.0.0:4318"
    api_addr = "0.0.0.0:8080"
    log_format = {{ .Values.logFormat | toJson }}

    [storage]
    catalog = {{ .Values.storage.catalog | default (ternary "/data/catalog.ducklake" "" $single) | toJson }}
    data_path = {{ .Values.storage.dataPath | default (ternary "/data/lake/" "" $single) | toJson }}
    data_inlining_row_limit = {{ int .Values.storage.dataInliningRowLimit }}
    target_file_size = {{ .Values.storage.targetFileSize | toJson }}
    extensions = {{ include "otel-ducklake.tomlValue" (.Values.storage.extensions | default list) }}
    {{- range .Values.storage.secrets }}

    [[storage.secrets]]
    {{- range $k, $v := . }}
    {{ $k }} = {{ include "otel-ducklake.tomlValue" $v }}
    {{- end }}
    {{- end }}

    [ingest]
    flush_interval = {{ .Values.ingest.flushInterval | toJson }}
    flush_rows = {{ int .Values.ingest.flushRows }}
    max_buffer_bytes = {{ .Values.ingest.maxBufferBytes | toJson }}
    max_request_bytes = {{ .Values.ingest.maxRequestBytes | toJson }}

    [retention]
    traces = {{ .Values.retention.traces | toString | toJson }}
    logs = {{ .Values.retention.logs | toString | toJson }}
    metrics = {{ .Values.retention.metrics | toString | toJson }}

    [maintenance]
    enabled = {{ .Values.maintenance.enabled }}
    catalog_wide = {{ .Values.maintenance.catalogWide }}
    compact_interval = {{ .Values.maintenance.compactInterval | toJson }}
    full_compact_interval = {{ .Values.maintenance.fullCompactInterval | toJson }}
    retention_interval = {{ .Values.maintenance.retentionInterval | toJson }}

    [query]
    max_concurrent = {{ int .Values.query.maxConcurrent }}
    timeout = {{ .Values.query.timeout | toJson }}
    max_window = {{ .Values.query.maxWindow | toJson }}
    enable_sql = {{ .Values.query.enableSql }}

    [auth]
    {{- if .Values.auth.enabled }}
    api_tokens = ["${ODL_API_TOKEN}"]
    {{- else }}
    api_tokens = []
    {{- end }}
    {{- if and .Values.auth.enabled .Values.auth.ingestAuth }}
    ingest_tokens = ["${ODL_INGEST_TOKEN}"]
    {{- else }}
    ingest_tokens = []
    {{- end }}

    [duckdb]
    memory_limit = {{ .Values.duckdb.memoryLimit | toJson }}
    threads = {{ int .Values.duckdb.threads }}
    temp_directory = "/data/tmp"
    extension_directory = "/opt/duckdb/extensions"
    autoinstall_extensions = false
    {{- with .Values.extraConfig }}

    # extraConfig (only extra [[storage.secrets]] blocks are valid here)
    {{- . | nindent 4 }}
    {{- end }}
