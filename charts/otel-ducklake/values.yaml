# Default values for otel-ducklake.

image:
  repository: ghcr.io/helico-tech/otel-ducklake
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# single: one pod (StatefulSet) with a PersistentVolume holding a DuckDB-file
#         catalog and (by default) the Parquet files. Simplest; replicaCount is
#         forced to 1 because a DuckDB/SQLite catalog file allows one writer.
# shared: a Deployment whose pods share an external PostgreSQL catalog and
#         object storage (S3, GCS, Azure, R2, MinIO). replicaCount > 1 allowed.
mode: single

# Only used in shared mode.
replicaCount: 2

storage:
  # Catalog connection. single mode default: /data/catalog.ducklake.
  # shared mode (required): "postgres:host=pg dbname=ducklake user=odl password=${PGPASSWORD}"
  # ${NAME} is replaced from the pod environment (see extraEnv / envFrom).
  catalog: ""
  # Parquet location. single mode default: /data/lake/. Examples:
  # s3://bucket/otel/, gs://bucket/otel/, az://container/otel/, r2://bucket/otel/
  dataPath: ""
  # DuckDB secrets for object storage, rendered as [[storage.secrets]].
  # Use ${ENV} references for credentials and provide them via extraEnv/envFrom.
  secrets: []
  #  - type: s3
  #    provider: credential_chain        # IRSA / pod identity / instance role
  #  - type: s3
  #    key_id: "${S3_ACCESS_KEY_ID}"
  #    secret: "${S3_SECRET_ACCESS_KEY}"
  #    endpoint: "minio.minio:9000"
  #    url_style: path
  #    use_ssl: false
  #    region: us-east-1
  #  - type: gcs
  #    key_id: "${GCS_HMAC_KEY}"
  #    secret: "${GCS_HMAC_SECRET}"
  #  - type: azure
  #    connection_string: "${AZURE_STORAGE_CONNECTION_STRING}"
  # Extra DuckDB extensions (must be in the image; the image ships ducklake,
  # httpfs, aws, azure, postgres, sqlite, json, parquet, icu).
  extensions: []
  dataInliningRowLimit: 1000
  targetFileSize: 128MB

ingest:
  flushInterval: 5s
  flushRows: 200000
  maxBufferBytes: 512MB
  maxRequestBytes: 32MB

retention:
  traces: 7d
  logs: 7d
  metrics: 30d

maintenance:
  enabled: true
  # Snapshot expiry and old-file cleanup are catalog-wide. Running them on every
  # replica is safe (idempotent) but redundant; set false if another
  # application sharing the catalog already runs them.
  catalogWide: true
  compactInterval: 10m
  fullCompactInterval: 6h
  retentionInterval: 1h

query:
  maxConcurrent: 4
  timeout: 30s
  maxWindow: 31d
  # POST /api/v1/sql; requires auth.enabled.
  enableSql: false

auth:
  # When enabled, the query API (and optionally OTLP ingest) require a bearer token.
  enabled: false
  # Use an existing Secret with keys `api-token` and `ingest-token`.
  existingSecret: ""
  # Or let the chart create one (stored in a Secret, not the ConfigMap).
  apiToken: ""
  # Empty = OTLP ingest without authentication (typical inside a cluster).
  ingestToken: ""

duckdb:
  # Keep below the container memory limit (about 70%).
  memoryLimit: 1400MB
  threads: 0

logFormat: json

# Raw TOML appended to the generated config (advanced).
extraConfig: ""

# Extra environment, e.g. credentials referenced as ${NAME} in storage.*:
# extraEnv:
#   - name: PGPASSWORD
#     valueFrom: {secretKeyRef: {name: pg-credentials, key: password}}
extraEnv: []
envFrom: []

persistence:
  # single mode: PVC for /data. shared mode always uses an emptyDir for scratch space.
  enabled: true
  size: 20Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

service:
  type: ClusterIP
  annotations: {}
  ports:
    otlpGrpc: 4317
    otlpHttp: 4318
    api: 8080

ingress:
  # Exposes the query API (port 8080). OTLP is usually consumed in-cluster.
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: otel-ducklake.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1

serviceAccount:
  create: true
  name: ""
  # e.g. eks.amazonaws.com/role-arn for IRSA, azure.workload.identity/client-id ...
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Give the flusher time to write buffered data on shutdown.
terminationGracePeriodSeconds: 60

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
