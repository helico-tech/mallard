[package]
name = "mallard"
description = "mallard: errors, traces, logs and metrics on one DuckLake. Server, CLI and TUI in one binary."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "mallard"
path = "src/main.rs"

[dependencies]
mallard-server.workspace = true
mallard-client.workspace = true
odl-cli.workspace = true
sdl-cli.workspace = true
mallard-duck.workspace = true
mallard-common = { workspace = true, features = ["server"] }
tokio.workspace = true
tokio-util.workspace = true
clap.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde_json.workspace = true
serde.workspace = true
futures.workspace = true
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

[lints]
workspace = true
