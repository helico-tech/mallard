[package]
name = "odl-server"
description = "OpenTelemetry collector backed by DuckLake"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "otel-ducklake"
path = "src/main.rs"

[dependencies]
odl-api.workspace = true
# json/parquet are compiled in: always needed, and container images then
# work without downloading them (the extension files are ~100 MB).
duckdb = { workspace = true, features = ["json", "parquet"] }
arrow.workspace = true
opentelemetry-proto.workspace = true
tonic.workspace = true
prost.workspace = true
axum.workspace = true
tower-http.workspace = true
tower.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
humantime.workspace = true
xxhash-rust.workspace = true
flate2.workspace = true
base64.workspace = true
toml = "0.9"
zstd = "0.13"
tokio-util = "0.7"

[dev-dependencies]
odl-client = { path = "../odl-client" }
serde = { workspace = true }
tempfile = "3"
reqwest.workspace = true
