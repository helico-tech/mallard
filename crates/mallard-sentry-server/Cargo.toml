[package]
name = "mallard-sentry-server"
description = "Sentry-compatible error tracking server backed by DuckLake"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
mallard-sentry-api = { workspace = true, features = ["openapi"] }
mallard-sentry-protocol.workspace = true
mallard-common = { workspace = true, features = ["server"] }
mallard-duck.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
clap.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
bytes.workspace = true
futures.workspace = true
flate2.workspace = true
xxhash-rust.workspace = true
metrics.workspace = true
url.workspace = true
toml.workspace = true
axum = { workspace = true, features = ["multipart"] }
tower = { workspace = true, features = ["limit"] }
tower-http = { workspace = true, features = ["decompression-full", "limit"] }
http-body-util = "0.1"
object_store = { version = "0.14", features = ["aws", "azure"] }
crossbeam-channel = "0.5"
moka = { version = "0.12", features = ["sync", "future"] }
sha1 = "0.11"
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
sourcemap = "9"
rand.workspace = true

[dev-dependencies]
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
tempfile.workspace = true
reqwest = { workspace = true, features = ["multipart"] }

[lints]
workspace = true
