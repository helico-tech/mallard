[package]
name = "sdl-server"
description = "Sentry-compatible error tracking server backed by DuckLake"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sentry-ducklake"
path = "src/main.rs"

[dependencies]
sdl-types = { workspace = true, features = ["openapi"] }
sdl-protocol.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
utoipa.workspace = true
bytes.workspace = true
futures.workspace = true
flate2.workspace = true
xxhash-rust.workspace = true
duckdb = { version = "=1.20000.1", features = ["bundled", "json", "parquet"] }
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "decompression-full", "trace", "limit", "catch-panic"] }
utoipa-scalar = { version = "0.4", features = ["axum"] }
object_store = { version = "0.14", features = ["aws", "azure"] }
crossbeam-channel = "0.5"
moka = { version = "0.12", features = ["sync", "future"] }
sha1 = "0.11"
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
sourcemap = "9"
humantime = "2"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
url = "2"
rand = "0.10"
envy = "0.4"
humantime-serde = "1"

[dev-dependencies]
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
tempfile = "3"
reqwest = { workspace = true, features = ["multipart"] }
