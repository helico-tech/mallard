name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/otel-ducklake

jobs:
  # Linux binaries are built on Ubuntu 22.04 so they need glibc >= 2.35
  # (Debian 12, Ubuntu 22.04+, RHEL 10). Use the container image elsewhere.
  binaries:
    strategy:
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: macos-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked -p odl-server -p odl-cli -p odl-loadgen
      - name: package
        run: |
          name=otel-ducklake-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/release/otel-ducklake target/release/odl target/release/odl-loadgen "$name/"
          cp config/otel-ducklake.example.toml "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: otel-ducklake-*.tar.gz*

  # Build each architecture natively (compiling DuckDB under QEMU is very
  # slow), push by digest, then merge into one multi-arch tag.
  image:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*

  image-manifest:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `latest` is added automatically for non-prerelease versions only
          # (flavor latest=auto); v1.2.3-rc.1 does not move it.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: create manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

  release:
    needs: [binaries, image-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: package chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/otel-ducklake --version "$version" --app-version "$version" -d dist
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Container image: `ghcr.io/${{ github.repository_owner }}/otel-ducklake:${{ github.ref_name }}` (linux/amd64, linux/arm64).
            Linux binaries need glibc >= 2.35 (Debian 12, Ubuntu 22.04+); otherwise use the image.
          files: dist/*
      # One-time setup: GHCR creates the package as private on the first push.
      # Make it public (Package settings → Change visibility) so the Helm chart
      # and `docker pull` work without imagePullSecrets.
      - name: reminder
        run: echo "::notice::If this was the first release, make the GHCR package public (Package settings → Change visibility)."
