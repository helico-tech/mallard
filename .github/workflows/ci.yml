name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # libduckdb-sys unpacks its sources into target/duckdb-sources and fails
      # ("Directory not empty") on a half-restored copy; it re-unpacks if needed.
      - name: Drop cached DuckDB source tree
        run: rm -rf target/duckdb-sources
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # The slim build: the same CLI and TUI with no server and no DuckDB (ADR 0023).
      - name: Without the server
        run: |
          cargo clippy -p mallard --no-default-features --all-targets --locked -- -D warnings
          cargo test -p mallard --no-default-features --locked
          cargo build -p mallard --no-default-features --locked
          tree=$(cargo tree -p mallard --no-default-features --locked -e all)
          if grep -i duckdb <<<"$tree"; then
            echo "::error::DuckDB in the --no-default-features tree"
            exit 1
          fi

  web:
    name: web UI (types, unit, build, browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Drop cached DuckDB source tree
        run: rm -rf target/duckdb-sources
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/mallard-web/ui/package-lock.json
      - name: Install
        working-directory: crates/mallard-web/ui
        run: npm ci
      - name: Types, unit tests, build
        working-directory: crates/mallard-web/ui
        run: |
          npm run build
          npm test
      - name: API types are current
        working-directory: crates/mallard-web/ui
        run: |
          npm run api-types
          git diff --exit-code src/api
      - name: Build the binary with the UI inside
        run: cargo build --locked -p mallard
      - name: Browser tests
        working-directory: crates/mallard-web/ui
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  helm:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Lint and render every CI values file
        run: |
          set -e
          chart=deploy/helm/mallard
          for f in "$chart"/ci/*.yaml; do
            echo "::group::$f"
            helm lint "$chart" --strict -f "$f"
            helm template ci "$chart" -f "$f" > /dev/null
            echo "::endgroup::"
          done

  docker:
    name: docker build, smoke test, helm on kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: mallard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          set -e
          docker run -d --name mallard -p 8080:8080 -p 4318:4318 --read-only --tmpfs /tmp \
            -v mallard-data:/data -e 'MALLARD_SERVER__API_TOKENS=["ci"]' mallard:ci
          for _ in $(seq 1 60); do
            curl -fsS localhost:8080/readyz && break
            sleep 1
          done
          curl -fsS localhost:8080/readyz
          curl -fsS -XPOST -H 'Authorization: Bearer ci' -H 'content-type: application/json' \
            localhost:8080/sentry/v1/projects -d '{"name":"ci"}'
          curl -fsS -XPOST -H 'content-type: application/json' localhost:4318/v1/traces -d '{"resourceSpans":[]}'
          docker exec mallard mallard --url http://localhost:8080 --token ci status
      - name: Server logs
        if: always()
        run: docker logs mallard || true
      # The same image, installed with the Helm chart on a kind cluster.
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: mallard
      - name: Helm install on kind (duckdb, s3 + postgres)
        run: |
          kind load docker-image mallard:ci --name mallard
          deploy/helm/kind/test.sh mallard:ci

  e2e-sentry:
    name: e2e (real Sentry SDKs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # libduckdb-sys unpacks its sources into target/duckdb-sources and fails
      # ("Directory not empty") on a half-restored copy; it re-unpacks if needed.
      - name: Drop cached DuckDB source tree
        run: rm -rf target/duckdb-sources
      - name: Build mallard
        run: cargo build -p mallard --locked
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/sentry/package-lock.json
      - name: Install e2e dependencies
        working-directory: e2e/sentry
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: e2e/sentry
        env:
          MALLARD_BIN: ${{ github.workspace }}/target/debug/mallard
        run: npm test
