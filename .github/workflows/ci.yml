name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        # Tests download the DuckDB ducklake extension on first use.
        run: cargo test --workspace --locked

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: lint
        run: |
          helm lint charts/otel-ducklake
          helm lint charts/otel-ducklake -f charts/otel-ducklake/ci/single-values.yaml
          helm lint charts/otel-ducklake -f charts/otel-ducklake/ci/shared-values.yaml
      - name: template
        run: |
          helm template t charts/otel-ducklake > /dev/null
          helm template t charts/otel-ducklake -f charts/otel-ducklake/ci/single-values.yaml > /dev/null
          helm template t charts/otel-ducklake -f charts/otel-ducklake/ci/shared-values.yaml > /dev/null
      - name: invalid values are rejected
        run: |
          ! helm template t charts/otel-ducklake --set mode=shared 2>/dev/null
          ! helm template t charts/otel-ducklake --set auth.enabled=true 2>/dev/null
          ! helm template t charts/otel-ducklake --set query.enableSql=true 2>/dev/null

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: otel-ducklake:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        run: |
          docker run -d --name odl -p 4318:4318 -p 8080:8080 otel-ducklake:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/api/v1/health && break; sleep 1; done
          docker exec odl odl-loadgen --endpoint http://localhost:4318 --rate 20 --duration 10s
          sleep 7
          docker exec odl odl services --since 5m
          docker logs odl 2>&1 | tail -20
          docker rm -f odl
