name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        # Tests download the DuckDB ducklake extension on first use.
        run: cargo test --workspace --locked

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: lint
        run: |
          helm lint charts/otel-ducklake
          helm lint charts/otel-ducklake -f charts/otel-ducklake/ci/single-values.yaml
          helm lint charts/otel-ducklake -f charts/otel-ducklake/ci/shared-values.yaml
      - name: template
        run: |
          helm template t charts/otel-ducklake > /dev/null
          helm template t charts/otel-ducklake -f charts/otel-ducklake/ci/single-values.yaml > /dev/null
          helm template t charts/otel-ducklake -f charts/otel-ducklake/ci/shared-values.yaml > /dev/null
      - name: invalid values are rejected
        # `! cmd` does not fail a bash -e script; check each case explicitly.
        run: |
          must_fail() {
            if helm template t charts/otel-ducklake "$@" >/dev/null 2>&1; then
              echo "::error::helm template $* should have failed"
              exit 1
            fi
            echo "rejected as expected: $*"
          }
          must_fail --set mode=shared
          must_fail --set mode=shared --set storage.catalog=/data/c.ducklake --set storage.dataPath=s3://b/
          must_fail --set auth.enabled=true
          must_fail --set auth.ingestAuth=true
          must_fail --set auth.enabled=true --set auth.apiToken=x --set auth.ingestAuth=true
          must_fail --set query.enableSql=true
          must_fail --set ingress.enabled=true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: otel-ducklake:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        run: |
          set -euo pipefail
          docker run -d --name odl -p 127.0.0.1:4318:4318 -p 127.0.0.1:8080:8080 \
            -e ODL_INGEST__FLUSH_INTERVAL=1s otel-ducklake:ci
          trap 'docker logs odl 2>&1 | tail -40; docker rm -f odl >/dev/null' EXIT
          healthy=0
          for i in $(seq 1 60); do
            if docker exec odl odl health; then healthy=1; break; fi
            sleep 1
          done
          if [ "$healthy" != 1 ]; then echo "::error::server never became healthy"; exit 1; fi
          docker exec odl odl-loadgen --endpoint http://localhost:4318 --rate 20 --duration 10s --metrics-interval 2s
          # Data must be queryable after the flush interval.
          for i in $(seq 1 20); do
            if docker exec odl odl -o json services --since 5m | jq -e 'length > 0' >/dev/null; then
              ok=1; break
            fi
            sleep 1
          done
          if [ "${ok:-0}" != 1 ]; then echo "::error::no services returned after ingest"; exit 1; fi
          docker exec odl odl services --since 5m
          docker exec odl odl -o json traces --since 5m --limit 5 | jq -e 'length > 0' >/dev/null
          docker exec odl odl -o json logs --since 5m -n 5 | jq -e 'length > 0' >/dev/null
          docker exec odl odl -o json metrics --since 5m | jq -e 'length > 0' >/dev/null
